packages:
  - "packages/*"
  - "demos/*"
  - "apps/*"
  - "docs"

allowBuilds:
  "@atcute/time-ms": false
  # The reference PDS (@atproto/pds, via @atproto/dev-env) stores data in
  # better-sqlite3, a native module that must compile to load. cbor-extract
  # and protobufjs ship pure-JS fallbacks, so their build scripts stay off.
  better-sqlite3: true
  cbor-extract: false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
  workerd: false

# @getcirrus/spaces and @getcirrus/space-conformance keep every alpha
# @atproto package in devDependencies, where tsdown bundles it into dist, so
# consumers never resolve an alpha range. Since the 2026-11-24 build the alpha
# packages depend on each other (and on the stable lex-cbor/lex-data/star
# releases) at exact versions, so the overrides that pinned the lex family
# away from its broken bare `0.0.0` / `0.0.0-stage` releases are gone.
# Bump the alpha pins in lockstep with @atproto/space.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@atproto-labs/did-resolver@0.0.0-spaces-alpha-20261124235736'
  - '@atproto-labs/fetch-node@0.0.0-spaces-alpha-20261124235736'
  - '@atproto-labs/handle-resolver-node@0.0.0-spaces-alpha-20261124235736'
