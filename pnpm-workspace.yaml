packages:
  - "packages/*"
  - "demos/*"
  - "apps/*"
  - "docs"

allowBuilds:
  "@atcute/time-ms": false
  # The reference PDS (@atproto/pds, via @atproto/dev-env) stores data in
  # better-sqlite3, a native module that must compile to load. cbor-extract
  # and protobufjs ship pure-JS fallbacks, so their build scripts stay off.
  better-sqlite3: true
  cbor-extract: false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
  workerd: false

# The spaces alpha published the @atproto/lex* family twice: once as a broken
# bare `0.0.0` whose manifest still carries unresolved `workspace:*` sibling
# specifiers (so it cannot install outside the atproto monorepo), and once as a
# clean `0.0.0-spaces-alpha-*` build. @atproto/star likewise has a corrupt
# `0.0.0-stage` tarball. Alpha dependency ranges are `^0.0.0-spaces-alpha-*`,
# and by semver both a bare `0.0.0` and `0.0.0-stage` outrank that prerelease,
# so pnpm picks the broken build. @atproto/space and @atproto/dev-env (the
# reference PDS harness the conformance matrix runs against) both reach these.
#
# Pin the family to the clean timestamp build. lex-cbor, lex-data and lex-json
# are also stable dependencies of @getcirrus/pds (^0.0.x for @atproto/repo
# interop), so those overrides only apply to edges asking for the alpha range.
#
# Overrides don't reach consumers of the published packages, so
# @getcirrus/spaces and @getcirrus/space-conformance keep every alpha
# @atproto package in devDependencies, where tsdown bundles it into dist.
# Consumers never resolve an alpha range. Bump these in lockstep with
# @atproto/space.
overrides:
  "@atproto/lex": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-resolver": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-client": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-schema": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-builder": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-installer": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-document": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-cbor@^0.0.0-spaces-alpha": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-data@^0.0.0-spaces-alpha": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/lex-json@^0.0.0-spaces-alpha": "0.0.0-spaces-alpha-20261105160032"
  "@atproto/star": "0.0.0-spaces-alpha-20261105160032"

linkWorkspacePackages: true
